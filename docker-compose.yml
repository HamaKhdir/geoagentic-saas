
services:
  # PostGIS Database Service
  db:
    image: postgis/postgis:15-3.3
    container_name: geoagentic_db
    environment:
      POSTGRES_USER: hama_dev
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: geoagentic_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hama_dev -d geoagentic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Spatial Agent Backend Service
  backend:
    build:
      context: ./backend
    container_name: geoagentic_backend
    ports:
      - "8001:8000"
    env_file:
      - .env        
    environment:
      - DATABASE_URL=postgresql://hama_dev:SecretPassword123!@db:5432/geoagentic_db
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_DEPLOYMENT=${OPENAI_CHAT_DEPLOYMENT}
      - OPENAI_EMBEDDING_DEPLOYMENT=${OPENAI_EMBEDDING_DEPLOYMENT}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Vite + React Frontend Service
  frontend:
    build: ./frontend
    container_name: geoagentic_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: